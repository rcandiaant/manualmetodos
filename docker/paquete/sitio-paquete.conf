# Sitio de Apache del contenedor `paquete`: el paquete vive en /var/www/app y solo public/ se publica,
# igual que el Document Root del subdominio en cPanel (docs/api.md §6 «Qué se sube y dónde»).
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
