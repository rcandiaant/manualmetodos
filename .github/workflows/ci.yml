name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliente
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cliente/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Esquema del servidor al día
        run: npm run exportar-esquema && git diff --exit-code ../servidor/config/esquema-documento.json
      - run: npm audit --audit-level=high

  servidor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: servidor
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root_ci
          MARIADB_DATABASE: manual_pruebas
          MARIADB_USER: manual
          MARIADB_PASSWORD: manual_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      BD_HOST: 127.0.0.1
      BD_PRUEBAS_DSN: "mysql:host=127.0.0.1;port=3306;dbname=manual_pruebas;charset=utf8mb4"
      BD_NOMBRE_PRUEBAS: manual_pruebas
      BD_USUARIO: manual
      BD_CLAVE: manual_ci
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, zip, mbstring, sodium, apcu
          ini-values: apc.enable_cli=1
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - run: vendor/bin/phpunit

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
